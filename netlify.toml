# Flutter web app. Netlify's build image has no Flutter SDK, so the build
# command downloads the pinned stable release and then runs `flutter build web`.
# /usr/bin is put ahead of the rest of PATH so Flutter's version detection uses
# the system git (a restricted git wrapper makes Flutter report 0.0.0-unknown).
[build]
  command = "if [ ! -x \"$HOME/flutter/bin/flutter\" ]; then curl -fsSL \"https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz\" | tar -xJ -C \"$HOME\"; fi && export PATH=\"$HOME/flutter/bin:/usr/bin:$PATH\" && flutter config --no-analytics && flutter --version && flutter build web --release"
  publish = "build/web"

[build.environment]
  # pubspec.lock requires Flutter >= 3.47.0 / Dart >= 3.13.0; the project was
  # generated with Flutter 3.50.0 (see .metadata).
  FLUTTER_VERSION = "3.50.1"
